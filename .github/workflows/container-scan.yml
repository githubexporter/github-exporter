name: Container Scan
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Current Version
        id: get-current-version
        run: |
          echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Run Trivy
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        with:
          scan-type: image
          image-ref: 'githubexporter/github-exporter:${{ steps.get-current-version.outputs.version }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # GitHub disables scheduled workflows after 60 days without repository
  # activity, so re-enable this workflow on each scheduled run
  keepalive:
    name: Keep Schedule Enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Enable workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/container-scan.yml/enable"
